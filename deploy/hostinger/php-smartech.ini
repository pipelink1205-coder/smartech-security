; Copiar a /etc/php/8.3/mods-available/smartech.ini
; Activar: sudo phpenmod smartech && sudo systemctl reload php8.3-fpm
;
; La carpeta upload_tmp_dir la crea deploy.sh. PHP-FPM (www-data) debe poder escribirla.

file_uploads = On
upload_tmp_dir = /var/www/smartech/storage/app/upload-tmp
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
