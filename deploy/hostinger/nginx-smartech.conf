# Virtual host de Smart Tech Security.
# Copiar a /etc/nginx/sites-available/smartech y enlazar en sites-enabled.
# Certbot añade el bloque 443 la primera vez: certbot --nginx -d smarttechsecurity.com.co -d www.smarttechsecurity.com.co
#
# Si instalas otro PHP-FPM, cambia el socket fastcgi_pass.

server {
    listen 80;
    listen [::]:80;
    server_name smarttechsecurity.com.co www.smarttechsecurity.com.co;

    root /var/www/smartech/public;
    index index.php;
    charset utf-8;

    # Mismo tope que el requestFiltering de IIS (50 MB) para fotos del panel.
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
